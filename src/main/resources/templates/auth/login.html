<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ログイン | PromptHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

					<h1 class="text-center logo mb-2">
					    PromptHub
					</h1>
                    <p class="text-center text-muted mb-4">
                        AIプロンプト管理サービス
                    </p>

                    <h4 class="text-center mb-4">
                        ログイン
                    </h4>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                メールアドレス
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="メールアドレス">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                パスワード
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="パスワード">

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            ログイン

                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">

                        アカウントをお持ちでない方は

                        <a th:href="@{/signup}">
                            新規登録
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
