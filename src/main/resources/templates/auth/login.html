<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ログイン | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-logo-area">

            <div class="auth-logo-icon">
                P
            </div>

            <h1 class="auth-logo">
                PromptHub
            </h1>

            <p class="auth-description">
                AIプロンプトを整理・共有・再利用
            </p>

        </div>

        <h2 class="auth-title">
            ログイン
        </h2>

        <div class="auth-error"
             th:if="${param.error}">
            メールアドレスまたはパスワードが正しくありません。
        </div>

        <div class="auth-success"
             th:if="${param.logout}">
            ログアウトしました。
        </div>

        <form th:action="@{/login}"
              method="post"
              class="auth-form">

            <div class="form-group">

                <label for="email"
                       class="form-label">
                    メールアドレス
                </label>

                <input id="email"
                       type="email"
                       name="username"
                       class="form-input"
                       placeholder="example@example.com"
                       autocomplete="email"
                       required>

            </div>

            <div class="form-group">

                <label for="password"
                       class="form-label">
                    パスワード
                </label>

                <input id="password"
                       type="password"
                       name="password"
                       class="form-input"
                       placeholder="パスワードを入力"
                       autocomplete="current-password"
                       required>

            </div>

            <button type="submit"
                    class="primary-button auth-submit-button">
                ログイン
            </button>

        </form>

        <div class="auth-divider">
            <span>または</span>
        </div>

        <p class="auth-footer">

            アカウントをお持ちでない方は

            <a th:href="@{/signup}"
               class="text-link">
                新規登録
            </a>

        </p>

    </section>

    <p class="auth-copyright">
        © 2026 PromptHub
    </p>

</main>

</body>
</html>
