<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>新規登録 | PromptHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h1 class="text-center logo mb-2">
                        PromptHub
                    </h1>

                    <p class="text-center text-muted mb-4">
                        AIプロンプト管理サービス
                    </p>

                    <h4 class="text-center mb-4">
                        新規登録
                    </h4>

                    <form th:action="@{/signup}"
                          th:object="${signupForm}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                ユーザー名
                            </label>

                            <input type="text"
                                   th:field="*{username}"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                メールアドレス
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control">
						<div th:if="${#fields.hasErrors('email')}"
							th:errors="*{email}">
						</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                パスワード
                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                パスワード（確認）
                            </label>

                            <input type="password"
                                   th:field="*{passwordConfirm}"
                                   class="form-control">
						<div th:if="${#fields.hasErrors('passwordConfirm')}"
							th:errors="*{passwordConfirm}">
						</div>
						
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            新規登録

                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">

                        すでにアカウントをお持ちの方は

                        <a th:href="@{/login}">
                            ログイン
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
