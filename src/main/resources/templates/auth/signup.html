<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>新規登録 | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<main class="auth-shell auth-shell-wide">

    <section class="auth-card">

        <div class="auth-brand">

            <div class="auth-logo-mark">
                ✦
            </div>

            <h1 class="auth-brand-name">
                PromptHub
            </h1>

            <p class="auth-brand-description">
                あなたのAIプロンプトを資産にする
            </p>

        </div>

        <h2 class="auth-title">
            新規登録
        </h2>

        <form th:action="@{/signup}"
              th:object="${signupForm}"
              method="post"
              class="form">

            <div class="form-group">

                <label for="username"
                       class="form-label">
                    ユーザー名
                </label>

                <input id="username"
                       type="text"
                       th:field="*{username}"
                       class="form-input"
                       placeholder="ユーザー名を入力"
                       autocomplete="username">

                <p class="form-error"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">
                </p>

            </div>

            <div class="form-group">

                <label for="email"
                       class="form-label">
                    メールアドレス
                </label>

                <input id="email"
                       type="email"
                       th:field="*{email}"
                       class="form-input"
                       placeholder="example@example.com"
                       autocomplete="email">

                <p class="form-error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>

            </div>

            <div class="form-group">

                <label for="password"
                       class="form-label">
                    パスワード
                </label>

                <input id="password"
                       type="password"
                       th:field="*{password}"
                       class="form-input"
                       placeholder="パスワードを入力"
                       autocomplete="new-password">

                <p class="form-error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>

            </div>

            <div class="form-group">

                <label for="passwordConfirm"
                       class="form-label">
                    パスワード（確認）
                </label>

                <input id="passwordConfirm"
                       type="password"
                       th:field="*{passwordConfirm}"
                       class="form-input"
                       placeholder="もう一度入力してください"
                       autocomplete="new-password">

                <p class="form-error"
                   th:if="${#fields.hasErrors('passwordConfirm')}"
                   th:errors="*{passwordConfirm}">
                </p>

            </div>

            <button type="submit"
                    class="primary-button auth-submit">
                アカウントを作成
            </button>

        </form>

        <div class="auth-divider">
            <span>または</span>
        </div>

        <p class="auth-footer">

            すでにアカウントをお持ちの方は

            <a th:href="@{/login}"
               class="text-link">
                ログイン
            </a>

        </p>

    </section>

</main>

</body>
</html>
