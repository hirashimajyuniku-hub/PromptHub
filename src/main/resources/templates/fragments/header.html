<header th:fragment="header"
        class="site-header">

    <div class="header-container">

        <a th:href="@{/main}"
           class="header-brand">

            <span class="header-logo-mark">
                ✦
            </span>

            <span class="header-brand-name">
                PromptHub
            </span>

        </a>

        <nav class="header-nav">

            <a th:href="@{/prompt-list}"
               class="header-nav-link">
                プロンプト一覧
            </a>

            <a th:href="@{/prompt/create}"
               class="primary-button header-create-button">
                ＋ 新規投稿
            </a>

            <a th:if="${loginUser != null
                       and loginUser.role == 'ROLE_ADMIN'}"
               th:href="@{/admin}"
               class="header-nav-link header-admin-link">
                管理画面
            </a>

        </nav>

        <div class="header-actions"
             th:if="${loginUser != null}">

            <div class="header-user">

                <span class="header-user-label">
                    ログイン中
                </span>

                <span class="header-user-name"
                      th:text="${loginUser.displayName + ' さん'}">
                    ユーザー さん
                </span>

            </div>

            <form th:action="@{/logout}"
                  method="post">

                <button type="submit"
                        class="secondary-button header-logout-button">
                    ログアウト
                </button>

            </form>

        </div>

    </div>

</header>
