<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>プロンプト編集 | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page-container form-page-container">

    <div class="page-header">

        <div>

            <h1 class="page-title">
                プロンプト編集
            </h1>

            <p class="page-description">
                登録内容と公開設定を変更できます。
            </p>

        </div>

    </div>

    <section class="surface-card form-card">

        <form th:action="@{/prompt/{id}/edit(id=${prompt.id})}"
              method="post"
              class="form">

            <div class="form-group">

                <label for="title"
                       class="form-label">
                    タイトル
                </label>

                <input id="title"
                       type="text"
                       name="title"
                       th:value="${prompt.title}"
                       class="form-input"
                       placeholder="プロンプトのタイトル"
                       required>

            </div>

            <div class="form-group">

                <label for="content"
                       class="form-label">
                    プロンプト
                </label>

                <textarea id="content"
                          name="content"
                          class="form-textarea"
                          placeholder="プロンプト本文"
                          required
                          th:text="${prompt.content}">
                </textarea>

            </div>

            <div class="form-group">

                <label for="status"
                       class="form-label">
                    公開設定
                </label>

                <select id="status"
                        name="status"
                        class="form-select">

                    <option value="PUBLIC"
                            th:selected="${prompt.status == 'PUBLIC'}">
                        公開
                    </option>

                    <option value="PRIVATE"
                            th:selected="${prompt.status == 'PRIVATE'}">
                        非公開
                    </option>

                </select>

            </div>

            <div class="form-actions">

                <a th:href="@{/prompt/{id}(id=${prompt.id})}"
                   class="secondary-button">
                    キャンセル
                </a>

                <button type="submit"
                        class="primary-button">
                    更新
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
