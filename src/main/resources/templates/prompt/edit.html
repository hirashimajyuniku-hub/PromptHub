<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<meta charset="UTF-8">
<title>編集</title>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<!DOCTYPE html>
	<html xmlns:th="http://www.thymeleaf.org">

	<head>

	    <meta charset="UTF-8">
	    <title>プロンプト編集</title>


	<div class="container mt-4">

	    <div class="card shadow-sm">

	        <div class="card-body">

	            <h2 class="mb-4">プロンプト編集</h2>

	            <form th:action="@{/prompt/{id}/edit(id=${prompt.id})}"
	                  method="post">

	                <div class="mb-3">

	                    <label class="form-label">
	                        タイトル
	                    </label>

	                    <input
	                        type="text"
	                        class="form-control"
	                        name="title"
	                        th:value="${prompt.title}">

	                </div>

	                <div class="mb-3">

	                    <label class="form-label">
	                        プロンプト
	                    </label>

	                    <textarea
	                        class="form-control"
	                        rows="10"
	                        name="content"
	                        th:text="${prompt.content}">
	                    </textarea>

	                </div>

	                <div class="mb-4">

	                    <label class="form-label">
	                        公開設定
	                    </label>

	                    <select
	                        class="form-select"
	                        name="status">

	                        <option value="PUBLIC"
	                                th:selected="${prompt.status == 'PUBLIC'}">
	                            PUBLIC
	                        </option>

	                        <option value="PRIVATE"
	                                th:selected="${prompt.status == 'PRIVATE'}">
	                            PRIVATE
	                        </option>

	                    </select>

	                </div>

	                <button class="btn btn-primary">
	                    更新
	                </button>

	                <a th:href="@{/prompt/{id}(id=${prompt.id})}"
	                   class="btn btn-secondary">
	                    キャンセル
	                </a>

	            </form>

	        </div>

	    </div>

	</div>

	</body>

	</html>
</body>
</html>
