<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
	rel="stylesheet">
	<link rel="stylesheet"th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>プロンプト一覧</title>
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
<h1>プロンプト一覧</h1>

<div class="container mt-4">

	<div th:each="prompt : ${prompts}"
	     class="card prompt-card mb-3">

        <div class="card-body">

            <h4 class="card-title">
                <a class="text-decoration-none"
                   th:href="@{/prompt/{id}(id=${prompt.id})}"
                   th:text="${prompt.title}">
                </a>
            </h4>
			<p class="text-muted mb-2">
			    投稿者：
			    <span th:text="${prompt.user.displayName}"></span>
			</p>

            <span class="badge bg-primary"
                  th:text="${prompt.status}">
            </span>

            <p class="text-muted mt-3"
               th:text="${#strings.abbreviate(prompt.content,80)}">
            </p>

        </div>

    </div>

</div>
</body>
</html>
