<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>プロンプト一覧 | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page-container">

    <div class="page-header">

        <div>

            <h1 class="page-title">
                プロンプト一覧
            </h1>

            <p class="page-description">
                公開プロンプトと、自分の非公開プロンプトを確認できます。
            </p>

        </div>

        <a th:href="@{/prompt/create}"
           class="primary-button">
            ＋ 新規投稿
        </a>

    </div>

    <section class="prompt-grid">

        <article th:each="prompt : ${prompts}"
                 class="surface-card surface-card-hover prompt-card">

            <div class="prompt-card-header">

                <span class="status-badge"
                      th:classappend="${prompt.status == 'PRIVATE'}
                          ? ' status-private'
                          : ' status-public'"
                      th:text="${prompt.status == 'PRIVATE'
                          ? '非公開'
                          : '公開'}">
                    公開
                </span>

                <span class="prompt-author">

                    投稿者：

                    <span th:text="${prompt.user.displayName}">
                        ユーザー
                    </span>

                </span>

            </div>

            <h2 class="prompt-card-title">

                <a th:href="@{/prompt/{id}(id=${prompt.id})}"
                   th:text="${prompt.title}">
                    プロンプトタイトル
                </a>

            </h2>

            <p class="prompt-card-content"
               th:text="${#strings.abbreviate(prompt.content, 120)}">
                プロンプト本文
            </p>

            <div class="prompt-card-footer">

                <a th:href="@{/prompt/{id}(id=${prompt.id})}"
                   class="text-link">
                    詳細を見る
                </a>

            </div>

        </article>

    </section>

    <div class="empty-state surface-card"
         th:if="${#lists.isEmpty(prompts)}">

        <h2 class="empty-state-title">
            プロンプトがまだありません
        </h2>

        <p class="empty-state-text">
            最初のプロンプトを投稿してみましょう。
        </p>

        <a th:href="@{/prompt/create}"
           class="primary-button">
            プロンプトを投稿
        </a>

    </div>

</main>

</body>
</html>
