<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>プロンプト投稿 | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page-container form-page-container">

    <div class="page-header">

        <div>

            <h1 class="page-title">
                プロンプト投稿
            </h1>

            <p class="page-description">
                再利用したいプロンプトを登録します。
            </p>

        </div>

    </div>

    <section class="surface-card form-card">

        <form th:action="@{/prompt/create}"
              th:object="${promptForm}"
              method="post"
              class="form">

            <div class="form-group">

                <label for="title"
                       class="form-label">
                    タイトル
                </label>

                <input id="title"
                       type="text"
                       th:field="*{title}"
                       class="form-input"
                       placeholder="プロンプトの用途が分かるタイトル">

                <p class="form-error"
                   th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}">
                </p>

            </div>

            <div class="form-group">

                <label for="content"
                       class="form-label">
                    プロンプト
                </label>

                <textarea id="content"
                          th:field="*{content}"
                          class="form-textarea"
                          placeholder="プロンプト本文を入力してください">
                </textarea>

                <p class="form-error"
                   th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}">
                </p>

            </div>

            <div class="form-group">

                <label for="status"
                       class="form-label">
                    公開設定
                </label>

                <select id="status"
                        th:field="*{status}"
                        class="form-select">

                    <option value="PUBLIC">
                        公開
                    </option>

                    <option value="PRIVATE">
                        非公開
                    </option>

                </select>

                <p class="form-help">
                    非公開にすると、自分だけが閲覧できます。
                </p>

            </div>

            <div class="form-actions">

                <a th:href="@{/prompt-list}"
                   class="secondary-button">
                    キャンセル
                </a>

                <button type="submit"
                        class="primary-button">
                    保存
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
