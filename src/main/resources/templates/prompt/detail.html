<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>プロンプト詳細 | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page-container prompt-detail-container">

    <div class="detail-back-area">

        <a th:href="@{/prompt-list}"
           class="text-link">
            ← 一覧へ戻る
        </a>

    </div>

    <article class="surface-card prompt-detail-card">

        <div class="prompt-detail-header">

            <div>

                <span class="status-badge"
                      th:classappend="${prompt.status == 'PRIVATE'}
                          ? ' status-private'
                          : ' status-public'"
                      th:text="${prompt.status == 'PRIVATE'
                          ? '非公開'
                          : '公開'}">
                    公開
                </span>

                <h1 class="prompt-detail-title"
                    th:text="${prompt.title}">
                    プロンプトタイトル
                </h1>

            </div>

            <div class="prompt-detail-author">

                <span class="prompt-detail-author-label">
                    投稿者
                </span>

                <span th:text="${prompt.user.displayName}">
                    ユーザー
                </span>

            </div>

        </div>

        <div class="prompt-content-box">

            <p class="prompt-detail-content"
               th:text="${prompt.content}">
                プロンプト本文
            </p>

        </div>

        <div class="prompt-detail-actions">

            <a th:href="@{/prompt-list}"
               class="secondary-button">
                一覧へ戻る
            </a>

            <div class="owner-actions"
                 th:if="${prompt.user.id == loginUser.id}">

                <a th:href="@{/prompt/{id}/edit(id=${prompt.id})}"
                   class="secondary-button">
                    編集
                </a>

                <form th:action="@{/prompt/{id}/delete(id=${prompt.id})}"
                      method="post">

                    <button type="submit"
                            class="danger-button">
                        削除
                    </button>

                </form>

            </div>

        </div>

    </article>

</main>

</body>
</html>
