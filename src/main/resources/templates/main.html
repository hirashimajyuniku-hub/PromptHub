<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ホーム | PromptHub</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

    <section class="main-section">

        <div class="page-container">

            <div class="section-heading">

                <span class="section-eyebrow">
                    FEATURES
                </span>

                <h2 class="section-large-title">
                    PromptHubでできること
                </h2>

                <p class="section-description">
                    プロンプトを管理できます。
                </p>

            </div>

            <div class="feature-grid">

                <article class="surface-card  feature-card">

                    <div class="feature-number">
                        01
                    </div>

                    <h3 class="feature-title">
                        保存
                    </h3>

                    <p class="feature-description">
                        よく使うAIプロンプトを登録し、
                        いつでも確認できます。
                    </p>

                </article>

                <article class="surface-card  feature-card">

                    <div class="feature-number">
                        02
                    </div>

                    <h3 class="feature-title">
                        編集・削除
                    </h3>

                    <p class="feature-description">
                        自分が作成したプロンプトを、
                        用途に合わせて更新できます。
                    </p>

                </article>

                <article class="surface-card  feature-card">

                    <div class="feature-number">
                        03
                    </div>

                    <h3 class="feature-title">
                        公開設定
                    </h3>

                    <p class="feature-description">
                        他のユーザーへ共有するか、
                        自分だけで管理するか選択できます。
                    </p>

                </article>

                <article class="surface-card  feature-card">

                    <div class="feature-number">
                        04
                    </div>

                    <h3 class="feature-title">
                        再利用
                    </h3>

                    <p class="feature-description">
                        過去のプロンプトを探し直す手間を減らし、
                        AIを効率的に活用できます。
                    </p>

                </article>

            </div>

        </div>

    </section>

    <!-- CTA -->

    <section class="main-cta-section">

        <div class="page-container">

            <div class="main-cta-card">

                <div>

                    <span class="section-eyebrow">
                        GET STARTED
                    </span>

                    <h2 class="main-cta-title">
                        あなたのプロンプトを登録しましょう
                    </h2>

                    <p class="main-cta-description">
                        まずは普段よく使っているプロンプトを
                        1件保存してみましょう。
                    </p>

                </div>

                <a th:href="@{/prompt/create}"
                   class="primary-button">
                    新規投稿へ
                </a>

            </div>

        </div>

    </section>

</main>

</body>

</html>
